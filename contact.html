<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>اتصل بنا</title>
    <link rel="stylesheet" href="../css/contact.css">
</head>
<body>
    <nav>
        <img src="../img/logo site web.png" alt="">
        <a href="index.html">الرئيسية</a>
    </nav>

    <p>للاتصال بنا، يرجى ملء النموذج أدناه او الاتصال بنا عبر البريد الإلكتروني أو رقم الهاتف</p>

    <h1>نموذج الاتصال</h1>

    <form id="contact-form">

        <label for="nom">الإسم الكامل :</label>
        <input type="text" id="nom" name="name" required>

        <label for="email">البريد الإلكتروني :</label>
        <input type="email" id="email" name="email" required>

        <label for="message">الرسالة :</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">إرسال</button>

    </form>
    <h1>معلومات للاتصال بنا</h1>

    <div class="contact-info">

        <h3>البريد الإلكتروني : distance.learning.dz@email.com </h3>

        <h3>رقم الهاتف : 55 55 55 555 213+</h3>

    </div>

    <script src="../js/contact.js"></script>

    <footer>
        <p>حقوق النشر © 2026 منصة التعليم عن بعد DZ. جميع الحقوق محفوظة.</p>
    </footer>

</body>
</html>
